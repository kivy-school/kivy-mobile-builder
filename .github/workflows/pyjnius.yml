name: Build pyjnius Android Wheels

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.8'

      - name: install cibuildwheel
        run: pip install cibuildwheel

      # No NDK step: cibuildwheel resolves the NDK from ANDROID_HOME itself
      # (the last run compiled with .../Android/sdk/ndk/27.3.13750724, not the
      # separately downloaded r27c).
      - name: build wheels
        env:
          ANDROID_HOME: /Users/runner/Library/Android/sdk
        run: |
          mkdir -p build/wheels
          cd build
          bash ../kivy_scripts/pyjnius.sh

      - run: ls build/wheels

      - uses: actions/upload-artifact@v4
        with:
          name: pyjnius-android-wheels
          path: build/wheels/

  r2_upload:
    name: Upload to R2
    needs: [build]
    uses: ./.github/workflows/r2-upload.yml
    with:
      artifact: pyjnius-android-wheels
    secrets:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
