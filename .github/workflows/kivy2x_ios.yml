name: Build kivy2x iOS Wheels

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.8'

      - name: install cibuildwheel
        run: pip install cibuildwheel

      - name: build wheels
        run: |
          mkdir -p build/wheels
          cd build
          bash ../kivy_scripts/kivy2x_build_ios_wheels.sh

      - run: ls build/wheels

      - uses: actions/upload-artifact@v4
        with:
          name: kivy2x-ios-wheels
          path: build/wheels/

  anaconda_upload:
    name: Upload to Anaconda
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kivy2x-ios-wheels
          path: wheels/

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.8'

      - name: install anaconda client
        run: pip install anaconda-client

      - name: publish to anaconda
        run: |
          anaconda login --token "${{ secrets.ANACONDA_TOKEN }}"
          for FILE in wheels/*; do
            anaconda upload --force "$FILE" --summary "kivy2x iOS wheel"
          done
          anaconda logout
