name: Build libpython Android Wheels

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CPython version to build (e.g. 3.14.2); empty for the script default"
        required: false
        default: ''
      api_level:
        description: "Android API level to compile against and tag the wheel with"
        required: false
        default: '24'
  push:
    tags:
      - 'libpython-*'   # e.g. libpython-3.14.2

jobs:
  build:
    name: Build
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.11'

      - name: setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: resolve version
        id: ver
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ] && [[ "$GITHUB_REF_NAME" == libpython-* ]]; then
            VERSION="${GITHUB_REF_NAME#libpython-}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "building CPython ${VERSION:-<script default>}"

      - name: build libpython wheels
        env:
          ANDROID_HOME: /Users/runner/Library/Android/sdk
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          KIVYSCHOOL_PREBUILT_DISABLE: '1'
          API_LEVEL: ${{ inputs.api_level || '24' }}
        run: |
          mkdir -p dist/libpython
          python other_scripts/libpython/build_python_target.py ${{ steps.ver.outputs.version }} \
            --ndk "$ANDROID_NDK_ROOT" \
            --api "$API_LEVEL" \
            --out-dir dist/libpython

      - run: find dist/libpython -name "*.whl"

      - uses: actions/upload-artifact@v4
        with:
          name: libpython-android-wheels
          path: dist/libpython/**/*.whl

  anaconda_upload:
    name: Upload to Anaconda
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: libpython-android-wheels
          path: wheels/

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.8'

      - name: install anaconda client
        run: pip install anaconda-client

      - name: publish to anaconda
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          find wheels -name "*.whl" | while read FILE; do
            anaconda upload --force "$FILE" --summary "libpython Android wheel"
          done
